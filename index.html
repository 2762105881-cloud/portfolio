<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="description" content="个人设计作品集：视觉设计、文旅项目、展陈空间与项目落地。">
<title>作品集 | Portfolio</title>
<style>
:root{--bg:#09090b;--fg:#f4f2f0;--muted:#a7a5aa;--accent:#ef2b9b;--line:#28262d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:rgba(9,9,11,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:auto;padding:15px 22px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;letter-spacing:.18em;font-weight:700}
.nav a:last-child{font-size:12px;color:var(--muted)}
.hero{min-height:62vh;display:flex;flex-direction:column;justify-content:center;max-width:1120px;margin:auto;padding:70px 22px 55px;position:relative}
.kicker{font-size:11px;letter-spacing:.28em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(48px,10vw,112px);line-height:.92;letter-spacing:-.06em;margin:24px 0 18px;font-weight:800}
h1 span{display:block;color:transparent;-webkit-text-stroke:1px #f4f2f0}
.intro{max-width:540px;color:#b9b6bd;line-height:1.8;font-size:14px}
.hero-foot{margin-top:48px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px;letter-spacing:.08em}
.section-head{max-width:1120px;margin:0 auto;padding:22px;display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line)}
.section-head h2{font-size:22px;margin:0;letter-spacing:-.03em}
.section-head p{margin:0;color:var(--muted);font-size:11px}
.gallery{max-width:1120px;margin:0 auto;padding:0 22px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.item{background:#111114;border:1px solid #242229;overflow:hidden;cursor:default;transition:transform .2s,border-color .2s;position:relative;user-select:none;-webkit-user-select:none}
.item:hover{transform:translateY(-3px);border-color:#55505c}
.item img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;user-select:none}
/* Lightweight deterrents only; they cannot prevent screenshots or all downloads. */
.item::after{content:"PORTFOLIO PREVIEW · DO NOT REPOST";position:absolute;right:10px;bottom:54px;z-index:2;color:rgba(255,255,255,.78);background:rgba(0,0,0,.42);padding:6px 8px;font-size:9px;letter-spacing:.12em;pointer-events:none}
.item figcaption{position:relative;z-index:3}
.item figcaption{padding:13px 15px;color:#a8a5ad;font-size:11px;display:flex;justify-content:space-between;letter-spacing:.04em}
footer{border-top:1px solid var(--line);padding:28px 22px;display:flex;justify-content:space-between;max-width:1120px;margin:auto;color:var(--muted);font-size:11px;letter-spacing:.08em}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:95vh;object-fit:contain}
@media(max-width:640px){.hero{min-height:55vh;padding-top:58px}.gallery{grid-template-columns:1fr;padding-left:14px;padding-right:14px;gap:12px}.section-head{padding:20px 14px}.hero-foot{margin-top:32px}}
</style>
</head>
